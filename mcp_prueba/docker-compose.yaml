services:
  mcp_busquedas_web:
    image: mcp_prueba
    command: ["uv", "run", "mcp_servers/mcp_server_busquedas_web.py", "--server_type=sse"]
    networks:
      - mcp_network
    ports:
      - "21000:21000"

  mcp_db:
    image: mcp_prueba
    command: ["uv", "run", "mcp_servers/mcp_server_db.py", "--server_type=sse"]
    networks:
      - mcp_network
    ports:
      - "21005:21000"

  #filesystem-mcp:
