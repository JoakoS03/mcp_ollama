   #     "npx -y @modelcontextprotocol/server-filesystem /filesystem",
   #     "--port",
   #     "21000",
   #     "--ssePath",
   #     "/sse"
   #   ]
   # networks:
   #   - mcp_network
   # ports:
   #   - "21002:21000"
  

  mcp_client:
    image: mcp_prueba
    volumes:
      - ./res:/app/res
    command: ["python", "-m", "uvicorn", "ollama_client:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - mcp_network
      - app-network
    depends_on:
      - mcp_busquedas_web
      - mcp_db
      #- filesystem-mcp
    environment:
      MCP_SERVERS: http://mcp_busquedas_web:21000/sse,http://mcp_db:21000/sse
      OLLAMA_URL: ${OLLAMA_URL_ENV}
      OLLAMA_MODEL: qwen3-vl:30b
    ports:
      - "21003:8000"
      
# Crea la red.
networks:
  mcp_network:
    name: mcp_network
    driver: bridge
  app-network:
    external: true